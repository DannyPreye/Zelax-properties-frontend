components:
  schemas:
    Availability:
      type: object
      description: Serializer for availability calendar
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        is_available:
          type: boolean
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - date
      - id
    AvailabilityRequest:
      type: object
      description: Serializer for availability calendar
      properties:
        date:
          type: string
          format: date
        is_available:
          type: boolean
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
      required:
      - date
    BlockedDate:
      type: object
      description: Serializer for blocked dates
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 255
      required:
      - end_date
      - id
      - start_date
    BlockedDateRequest:
      type: object
      description: Serializer for blocked dates
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 255
      required:
      - end_date
      - start_date
    Booking:
      type: object
      description: Serializer for booking list/detail
      properties:
        id:
          type: integer
          readOnly: true
        property_obj:
          allOf:
          - $ref: '#/components/schemas/PropertyList'
          readOnly: true
        guest:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guest_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cleaning_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        service_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        security_deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cancellation_policy:
          allOf:
          - $ref: '#/components/schemas/CancellationPolicyEnum'
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_refund:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        nights:
          type: string
          readOnly: true
        is_past:
          type: string
          readOnly: true
        is_upcoming:
          type: string
          readOnly: true
        is_current:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_price
      - cancellation_policy
      - cancellation_refund
      - cancelled_at
      - check_in
      - check_out
      - cleaning_fee
      - created_at
      - guest
      - guest_count
      - id
      - is_current
      - is_past
      - is_upcoming
      - nights
      - property_obj
      - security_deposit
      - service_fee
      - status
      - total_price
      - updated_at
    BookingCreate:
      type: object
      description: Serializer for creating a booking
      properties:
        property_obj:
          type: integer
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guest_count:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - check_in
      - check_out
      - guest_count
      - property_obj
    BookingCreateRequest:
      type: object
      description: Serializer for creating a booking
